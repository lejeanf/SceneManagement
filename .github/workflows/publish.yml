name: "🚀 publish"

on:
    push:
        branches:
          - main
     
permissions:
    id-token: write
    contents: read

jobs:
    release:
        name: 🚀 publish
        runs-on: ubuntu-latest
        steps:
            - name: 📚 checkout
              uses: actions/checkout@v6

            - name: 🟢 node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://npmjs.org

            - name: 🛠️ setup unity upm-cli
              run: |
                npx --yes @rage-against-the-pixel/unity-cli upm-install

            - name: 🔏 sign unity package
              env:
                UPM_ENTERPRISE_ORGANIZATION_ID: ${{ secrets.UNITY_ORG_ID }}
                UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
                UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
              run: |
                # Targets the binary inside the bin/ subfolder
                ~/.unity-cli/upm/bin/upm package sign .

            - name: 🚀 publish
              run: npm publish --access public --provenance
              env:
                NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # (Handled automatically by setup-node OIDC)
