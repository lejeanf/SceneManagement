name: "🚀 publish"

on:
    push:
        branches:
            - main
            - "prerelease/*"

permissions:
    id-token: write # Required for npm OIDC and Provenance
    contents: write # Tag, release commit, and GitHub release

jobs:
    release:
        name: 🚀 publish
        runs-on: ubuntu-latest
        steps:
            - name: 📚 checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: 🟢 node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - name: 🔐 git identity
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: 📦 semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
                  UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
                  UNITY_ORGANIZATION_ID: ${{ secrets.UNITY_ORG_ID }}
              run: |
                  set -euo pipefail
                  # Install outside the Unity package. `npm install` in the repo
                  # root would try to fetch package.json dependencies such as
                  # com.unity.inputsystem from the npm registry.
                  INSTALL_DIR="${RUNNER_TEMP}/semantic-release"
                  mkdir -p "${INSTALL_DIR}"
                  npm install --prefix "${INSTALL_DIR}" --no-package-lock \
                    semantic-release@25.0.5 \
                    @semantic-release/commit-analyzer@13.0.1 \
                    @semantic-release/release-notes-generator@14.1.1 \
                    @semantic-release/npm@12.0.2 \
                    @semantic-release/github@11.0.6 \
                    @semantic-release/git@10.0.1 \
                    @semantic-release/exec@7.1.0 \
                    conventional-changelog-conventionalcommits@8.0.0
                  "${INSTALL_DIR}/node_modules/.bin/semantic-release"
